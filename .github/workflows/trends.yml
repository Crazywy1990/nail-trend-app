name: Weekly trends

# Measures trend terms (YouTube upload volume + beauty-magazine headlines) and commits
# apps/web/lib/engine/trends.json. The push triggers a normal Vercel deployment.
on:
  schedule:
    - cron: "17 13 * * 1"   # Mondays 13:17 UTC (morning in the US)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-writes
  cancel-in-progress: false

jobs:
  trends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pipeline
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python services/pipeline/pipeline.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/engine/trends.json services/pipeline/history.jsonl
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Weekly trends: $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
