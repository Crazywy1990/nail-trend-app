name: Fill missing photos

# Generates a photo for every empty (look, skin tone) slot with OpenAI and commits it
# to main, so the site never shows a placeholder. Runs weekly (after the trends job) to
# catch newly added looks, or by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths: ["apps/web/lib/engine/looks.json"]   # e.g. a merged look-discovery PR
  schedule:
    - cron: "47 13 * * 1"   # Mondays 13:47 UTC, 30 min after Weekly trends
  workflow_dispatch:
    inputs:
      looks:
        description: "Look IDs, space-separated (blank = all looks)"
        required: false
        default: ""
      max:
        description: "Most photos to make this run (cost guard; ~$0.20 each)"
        required: false
        default: "40"

permissions:
  contents: write

concurrency:
  group: catalog-writes
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python services/photos/fill.py --max "${{ inputs.max || '40' }}" ${{ inputs.looks }}
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/looks apps/web/lib/engine/looks.json services/api/app/seed/looks.json
          if git diff --cached --quiet; then echo "Nothing to fill."; exit 0; fi
          git commit -m "Fill missing look photos $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
